<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Agenda Sacramental SUD</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- PDF Lib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Icons (Phosphor Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="agenda-paper.css">
</head>

<body>

    <div class="app-layout">
        <!-- Sidebar / Form Section -->
        <aside class="editor-pane">
            <header class="editor-header">
                <a href="index.html" class="btn-icon-back" title="Voltar ao Início">
                    <i class="ph ph-arrow-left"></i>
                </a>
                <div>
                    <h1>Criar Agenda</h1>
                    <p>Preencha os detalhes da reunião</p>
                </div>
            </header>

            <form id="agendaForm" onsubmit="return false;">

                <!-- General Info -->
                <section class="form-group">
                    <h2>Informações Gerais</h2>
                    <div class="input-grid">
                        <div class="input-wrapper">
                            <label>Ala / Ramo</label>
                            <input type="text" name="ward" placeholder="Ex: Lisboa 5">
                        </div>
                        <div class="input-wrapper">
                            <label>Data</label>
                            <input type="date" name="date">
                        </div>
                    </div>
                    <div class="input-grid">
                        <div class="input-wrapper">
                            <label>Preside</label>
                            <input type="text" name="presiding" placeholder="Bispo...">
                        </div>
                        <div class="input-wrapper">
                            <label>Dirige</label>
                            <input type="text" name="conducting" placeholder="Irmão...">
                        </div>
                    </div>

                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="fastMeeting" name="fastMeeting">
                        <label for="fastMeeting">Reunião de Jejum e Testemunhos</label>
                    </div>
                </section>

                <!-- Music (Pianist & Chorister only) -->
                <section class="form-group">
                    <h2>Música</h2>
                    <div class="input-wrapper">
                        <label>Pianista / Organista</label>
                        <input type="text" name="organist">
                    </div>
                    <div class="input-wrapper">
                        <label>Regente</label>
                        <input type="text" name="chorister">
                    </div>
                </section>

                <!-- Recognitions -->
                <section class="form-group">
                    <h2>Reconhecimentos</h2>
                    <p class="helper-text">Adicione pessoas para serem reconhecidas.</p>
                    <div id="recognitions-input-container" class="dynamic-list-input">
                        <!-- Dynamic inputs will be added here via JS -->
                    </div>
                    <button id="btn-add-recognition" class="btn-add">+ Adicionar Pessoa</button>
                </section>

                <!-- Announcements (Standalone) -->
                <section class="form-group">
                    <h2>Anúncios</h2>
                    <div id="announcements-input-container" class="dynamic-list-input"></div>
                    <button id="btn-add-announcement" class="btn-add">+ Adicionar Anúncio</button>
                </section>

                <!-- Opening Hymn & Prayer -->
                <section class="form-group">
                    <h2>Abertura</h2>
                    <div class="hymn-input-wrapper">
                        <label>Hino de Abertura</label>
                        <input type="text" class="hymn-search" name="openingHymn"
                            placeholder="Buscar por número ou título...">
                        <div class="hymn-results"></div>
                    </div>

                    <div class="input-wrapper">
                        <label>Primeira Oração</label>
                        <input type="text" name="invocation">
                    </div>
                </section>

                <!-- Business (Ward Affairs) -->
                <section class="form-group">
                    <h2>Assuntos da Ala</h2>

                    <div class="input-wrapper">
                        <label>Desobrigações</label>
                        <p class="helper-text">Pessoas a serem desobrigadas.</p>
                        <div id="releases-input-container" class="dynamic-list-input"></div>
                        <button id="btn-add-release" class="btn-add">+ Adicionar Desobrigação</button>
                    </div>

                    <div class="input-wrapper" style="margin-top: 1rem;">
                        <label>Chamados (Apoios)</label>
                        <p class="helper-text">Novos chamados para serem apoiados.</p>
                        <div id="callings-input-container" class="dynamic-list-input"></div>
                        <button id="btn-add-calling" class="btn-add">+ Adicionar Chamado</button>
                    </div>
                </section>

                <!-- Sacrament -->
                <section class="form-group">
                    <h2>Sacramento</h2>
                    <div class="hymn-input-wrapper">
                        <label>Hino Sacramental</label>
                        <input type="text" class="hymn-search" name="sacramentHymn"
                            placeholder="Buscar por número ou título...">
                        <div class="hymn-results"></div>
                    </div>
                </section>

                <!-- Program -->
                <section class="form-group" id="program-section">
                    <h2>Programa Espiritual</h2>

                    <label style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem; display:block;">Oradores
                        (Antes do Hino)</label>
                    <div id="speakers-before-input-container" class="dynamic-list-input"></div>
                    <button id="btn-add-speaker-before" class="btn-add">+ Adicionar Orador</button>

                    <!-- Intermediate Hymn (Hidden if Fast Meeting) -->
                    <div id="intermediate-hymn-wrapper" class="hymn-input-wrapper"
                        style="margin: 1.5rem 0; border-top: 1px dashed #ddd; border-bottom: 1px dashed #ddd; padding: 1rem 0;">
                        <label>Hino Intermediário (Opcional)</label>
                        <input type="text" class="hymn-search" name="intermediateHymn"
                            placeholder="Buscar por número ou título...">
                        <div class="hymn-results"></div>
                    </div>

                    <label style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem; display:block;">Oradores
                        (Depois do Hino)</label>
                    <div id="speakers-after-input-container" class="dynamic-list-input"></div>
                    <button id="btn-add-speaker-after" class="btn-add">+ Adicionar Orador</button>
                </section>

                <!-- Closing -->
                <section class="form-group">
                    <h2>Encerramento</h2>
                    <div class="hymn-input-wrapper">
                        <label>Hino de Encerramento</label>
                        <input type="text" class="hymn-search" name="closingHymn"
                            placeholder="Buscar por número ou título...">
                        <div class="hymn-results"></div>
                    </div>
                    <div class="input-wrapper">
                        <label>Última Oração</label>
                        <input type="text" name="benediction">
                    </div>
                </section>

            </form>

            <div class="actions-footer">
                <button id="btn-export-pdf" class="btn btn-primary">
                    <i class="ph ph-file-pdf"></i> Gerar / Partilhar PDF
                </button>
            </div>
        </aside>

        <!-- Preview Section -->
        <main class="preview-pane">

            <button id="fullscreen-toggle" class="btn-fullscreen-toggle" onclick="toggleFullScreen()">
                <i class="ph ph-arrows-out-simple"></i>
                <span class="btn-text">Ecrã Inteiro</span>
            </button>
            <div class="paper-wrapper">
                <div id="agenda-paper" class="agenda-paper"></div>
            </div>
        </main>
    </div>

    <script src="hymns.js"></script>
    <script type="module" src="js/simple-ui.js"></script>
</body>

</html>
